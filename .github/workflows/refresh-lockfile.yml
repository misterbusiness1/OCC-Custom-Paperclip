name: Refresh Lockfile

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      base_ref:
        description: Exact release branch to receive the CI-owned lockfile PR
        required: true
        type: string
      expected_source_sha:
        description: Reviewed full source SHA currently at that branch
        required: true
        type: string

concurrency:
  group: refresh-lockfile-master
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Pin refresh target and refuse occupied refresh scope
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_EVENT: ${{ github.event_name }}
          REFRESH_BASE_REF: ${{ inputs.base_ref }}
          REFRESH_EXPECTED_SHA: ${{ inputs.expected_source_sha }}
          REFRESH_EVENT_SHA: ${{ github.sha }}
        run: |
          cp .github/scripts/lockfile-refresh-target.mjs "$RUNNER_TEMP/lockfile-refresh-target.mjs"
          node "$RUNNER_TEMP/lockfile-refresh-target.mjs" > "$RUNNER_TEMP/lockfile-refresh-target.json"
          echo "sha=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/lockfile-refresh-target.json")).expectedSha')" >> "$GITHUB_OUTPUT"
          echo "base=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/lockfile-refresh-target.json")).baseRef')" >> "$GITHUB_OUTPUT"

      - name: Checkout exact target source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Resolution-only installs do not populate the package store. Do not
          # claim the shared cache key with an empty archive before full installs.
          package-manager-cache: false

      - name: Refresh pnpm lockfile
        run: pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile

      - name: Fail on unexpected file changes
        run: |
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Fvq ' pnpm-lock.yaml'; then
            echo "Unexpected files changed during lockfile refresh:"
            echo "$changed"
            exit 1
          fi

      - name: Create an unoccupied CI-owned refresh pull request
        id: upsert-pr
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_EVENT: ${{ github.event_name }}
          REFRESH_BASE_REF: ${{ steps.target.outputs.base }}
          REFRESH_EXPECTED_SHA: ${{ steps.target.outputs.sha }}
          REFRESH_EVENT_SHA: ${{ steps.target.outputs.sha }}
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile unchanged, nothing to do."
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="chore/refresh-lockfile"
          git config user.name "lockfile-bot"
          git config user.email "lockfile-bot@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add pnpm-lock.yaml
          git commit -m "chore(lockfile): refresh pnpm-lock.yaml"
          # Recheck exact source and vacancy immediately before an atomic create-only push.
          node "$RUNNER_TEMP/lockfile-refresh-target.mjs" > /dev/null
          git push --force-with-lease="refs/heads/$BRANCH:" origin "HEAD:refs/heads/$BRANCH"
          export OWNED_REFRESH_SHA="$(git rev-parse HEAD)"
          node "$RUNNER_TEMP/lockfile-refresh-target.mjs" > /dev/null
          pr_url="$(gh pr create \
            --base "$REFRESH_BASE_REF" \
            --head "$BRANCH" \
            --title "chore(lockfile): refresh pnpm-lock.yaml" \
            --body "CI-generated lockfile for $REFRESH_BASE_REF at $REFRESH_EXPECTED_SHA. Only pnpm-lock.yaml changes.")"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge for lockfile PR
        if: steps.upsert-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge --auto --squash --delete-branch "${{ steps.upsert-pr.outputs.pr_url }}"
