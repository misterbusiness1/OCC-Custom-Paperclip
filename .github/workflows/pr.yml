name: PR

on:
  pull_request:
    branches:
      - master
      - 'release/**'

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# These jobs may run on self-hosted runners (doc/SELF-HOSTED-CI.md), so the
# token stays read-only regardless of the repository's default permissions.
permissions:
  contents: read

jobs:
  policy:
    runs-on: ${{ (vars.PAPERCLIP_CI_RUNS_ON != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.PAPERCLIP_CI_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      lockfile_regenerated: ${{ steps.regen_lockfile.outputs.regenerated }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Block manual lockfile edits
        if: >-
          github.head_ref != 'chore/refresh-lockfile' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          # Diff the PR branch against its merge base so recent base-branch commits
          # do not masquerade as changes made by the PR itself.
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")"
          if printf '%s\n' "$changed" | grep -qx 'pnpm-lock.yaml'; then
            echo "Do not commit pnpm-lock.yaml in pull requests. CI owns lockfile updates."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate Dockerfile deps stage
        run: node ./scripts/check-docker-deps-stage.mjs

      - name: Reject git push in adapter/runtime code
        run: node ./scripts/check-no-git-push.mjs

      - name: Test no-git-push check
        run: node --test ./scripts/check-no-git-push.test.mjs

      - name: Test general-server shard partition
        run: node --test ./scripts/__tests__/run-vitest-stable-shard.test.mjs

      - name: Test e2e shard partition
        run: node --test ./scripts/__tests__/e2e-shard.test.mjs

      - name: Test release verify workflow wiring
        run: node --test ./scripts/__tests__/release-verify-workflow.test.mjs

      - name: Test PR lockfile qualification
        run: node --test ./scripts/__tests__/pr-lockfile-workflow.test.mjs

      - name: Test overlay image workflow
        run: node --test ./scripts/__tests__/overlay-image-workflow.test.mjs
      - name: Test agent runtime images registry
        run: node --test ./scripts/__tests__/agent-runtime-images-workflow.test.mjs

      - name: Test standalone package build concurrency
        run: node --test ./scripts/__tests__/build-standalone-concurrency.test.mjs

      - name: Test local CI runner
        run: node --test ./scripts/__tests__/run-local-ci.test.mjs

      - name: Test vitest project coverage and workspace group runner
        run: node --test ./scripts/__tests__/run-vitest-stable-projects.test.mjs

      - name: Test sandbox provider test plan
        run: node --test ./scripts/__tests__/run-sandbox-provider-tests.test.mjs

      - name: Test dependency audit policy
        run: node --test ./scripts/dependency-audit.test.mjs

      - name: Test pnpm override pins
        run: node --test ./scripts/__tests__/pnpm-overrides.test.mjs

      - name: Validate release package manifest
        run: node ./scripts/release-package-map.mjs check

      - name: Verify release package bootstrap for changed manifests
        run: |
          mapfile -t changed_paths < <(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          PAPERCLIP_RELEASE_BOOTSTRAP_BASE_SHA="${{ github.event.pull_request.base.sha }}" \
            node ./scripts/check-release-package-bootstrap.mjs "${changed_paths[@]}"

      - name: Qualify dependency lockfile for downstream jobs
        id: regen_lockfile
        run: |
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "regenerated=0" >> "$GITHUB_OUTPUT"
          else
            echo "regenerated=1" >> "$GITHUB_OUTPUT"
          fi

      # Every PR needs a lockfile matching its actual checkout, including source
      # changes opened while the bot's lockfile refresh is still pending on base.
      # Share one generated graph with all frozen-install jobs when bytes change.
      - name: Upload regenerated lockfile for downstream jobs
        if: steps.regen_lockfile.outputs.regenerated == '1'
        uses: actions/upload-artifact@v7
        with:
          name: pr-lockfile
          path: pnpm-lock.yaml
          retention-days: 1
          if-no-files-found: error

  typecheck_release_registry:
    name: Typecheck + Release Registry
    needs: [policy]
    runs-on: ${{ (vars.PAPERCLIP_CI_RUNS_ON != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.PAPERCLIP_CI_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspaces whose build scripts skip TypeScript
        run: pnpm run typecheck:build-gaps

      - name: Verify release registry test coverage
        run: pnpm run test:release-registry

  dependency_audit:
    name: Dependency Audit
    needs: [policy]
    runs-on: ${{ (vars.PAPERCLIP_CI_RUNS_ON != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.PAPERCLIP_CI_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm run audit:prod

  typesafe_skill_suggestion:
    name: TypeSafe skill-suggestion standalone
    needs: [policy]
    runs-on: ${{ (vars.PAPERCLIP_CI_RUNS_ON != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.PAPERCLIP_CI_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install root and standalone dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir packages/plugins/plugin-typesafe-skill-suggestion install --ignore-workspace --frozen-lockfile
          node scripts/link-plugin-dev-sdk.mjs
          pnpm --filter @paperclipai/plugin-sdk build

      - name: Audit standalone production dependencies
        run: pnpm --ignore-workspace --dir packages/plugins/plugin-typesafe-skill-suggestion audit --prod --audit-level=high

      - name: Test, typecheck, build, and verify entrypoints
        run: |
          pnpm --dir packages/plugins/plugin-typesafe-skill-suggestion test
          pnpm --dir packages/plugins/plugin-typesafe-skill-suggestion typecheck
          pnpm --dir packages/plugins/plugin-typesafe-skill-suggestion build
          test -f packages/plugins/plugin-typesafe-skill-suggestion/dist/manifest.js
          test -f packages/plugins/plugin-typesafe-skill-suggestion/dist/worker.js

  sandbox_providers:
    name: Sandbox providers standalone
    needs: [policy]
    runs-on: ${{ (vars.PAPERCLIP_CI_RUNS_ON != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.PAPERCLIP_CI_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install root dependencies and build the plugin SDK
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @paperclipai/plugin-sdk build

      # The providers are excluded from the workspace, so no root vitest project
      # covers them: install each standalone, link the SDK, and run its tests.
      - name: Install and test each sandbox provider
        run: node scripts/run-sandbox-provider-tests.mjs

  general_tests:
    name: General tests (${{ matrix.group_label }})
    needs: [policy]
    runs-on: ${{ (vars.PAPERCLIP_CI_RUNS_ON != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.PAPERCLIP_CI_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The server suite is pinned to maxWorkers=1 (server/vitest.config.ts),
          # so it can only be parallelized across runners. Shard it to keep this
          # lane off the PR critical path.
          - group: general-server
            group_label: server (1/3)
            shard_index: 0
            shard_count: 3
          - group: general-server
            group_label: server (2/3)
            shard_index: 1
            shard_count: 3
          - group: general-server
            group_label: server (3/3)
            shard_index: 2
            shard_count: 3
          - group: general-workspaces-a
            group_label: workspaces-a
          - group: general-workspaces-b
            group_label: workspaces-b

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run grouped general test suites
        run: |
          if [ -n "${{ matrix.shard_count }}" ]; then
            pnpm test:run:general -- --group '${{ matrix.group }}' \
              --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }}
          else
            pnpm test:run:general -- --group '${{ matrix.group }}'
          fi

  verify:
    # Preserve the legacy required-check name while the underlying work runs in parallel.
    name: verify
    if: ${{ always() }}
    needs: [typecheck_release_registry, dependency_audit, typesafe_skill_suggestion, sandbox_providers, general_tests, build]
    runs-on: ${{ (vars.PAPERCLIP_CI_RUNS_ON != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.PAPERCLIP_CI_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 5

    steps:
      - name: Fail if any split verify lane failed
        env:
          TYPECHECK_RELEASE_REGISTRY_RESULT: ${{ needs.typecheck_release_registry.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency_audit.result }}
          TYPESAFE_SKILL_SUGGESTION_RESULT: ${{ needs.typesafe_skill_suggestion.result }}
          SANDBOX_PROVIDERS_RESULT: ${{ needs.sandbox_providers.result }}
          GENERAL_TESTS_RESULT: ${{ needs.general_tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$TYPECHECK_RELEASE_REGISTRY_RESULT" = "success"
          test "$DEPENDENCY_AUDIT_RESULT" = "success"
          test "$TYPESAFE_SKILL_SUGGESTION_RESULT" = "success"
          test "$SANDBOX_PROVIDERS_RESULT" = "success"
          test "$GENERAL_TESTS_RESULT" = "success"
          test "$BUILD_RESULT" = "success"

  build:
    name: Build
    needs: [policy]
    runs-on: ${{ (vars.PAPERCLIP_CI_RUNS_ON != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.PAPERCLIP_CI_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  verify_serialized_server:
    name: Verify serialized server suites (${{ matrix.shard_label }})
    needs: [policy]
    runs-on: ${{ (vars.PAPERCLIP_CI_RUNS_ON != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.PAPERCLIP_CI_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 0
            shard_count: 4
            shard_label: 1/4
          - shard_index: 1
            shard_count: 4
            shard_label: 2/4
          - shard_index: 2
            shard_count: 4
            shard_label: 3/4
          - shard_index: 3
            shard_count: 4
            shard_label: 4/4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run serialized server test shard
        run: pnpm test:run:serialized -- --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }}

  canary_dry_run:
    name: Canary Dry Run
    needs: [policy]
    runs-on: ${{ (vars.PAPERCLIP_CI_RUNS_ON != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.PAPERCLIP_CI_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `release.sh` always executes its Step 2/7 workspace build, even when
      # `--skip-verify` bypasses the initial verification gate. release.sh
      # also requires a clean working tree, so any in-place lockfile churn
      # from `pnpm install --frozen-lockfile` must be reverted first — unless
      # the policy job uploaded a regenerated lockfile (manifest-changing
      # PRs), in which case we stage the artifact-restored copy into an
      # ephemeral local commit so release.sh sees a clean tree and its
      # workspace build sees a lockfile that matches the manifest.
      - name: Release canary dry run via release.sh internal build
        env:
          USED_ARTIFACT_LOCKFILE: ${{ needs.policy.outputs.lockfile_regenerated || '0' }}
        run: |
          git checkout -B master HEAD
          if [ "$USED_ARTIFACT_LOCKFILE" = "1" ]; then
            git add pnpm-lock.yaml
            if ! git diff --cached --quiet; then
              git -c user.email=ci@paperclip.local -c user.name=CI \
                commit --no-verify -m "ci(canary): stage regenerated lockfile"
            fi
          else
            git checkout -- pnpm-lock.yaml
          fi
          ./scripts/release.sh canary --skip-verify --dry-run

  e2e_shards:
    name: e2e shard (${{ matrix.shard_label }})
    needs: [policy]
    runs-on: ${{ (vars.PAPERCLIP_CI_RUNS_ON != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.PAPERCLIP_CI_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Playwright lane is pinned to workers=1 (tests/e2e/playwright.config.ts)
          # because every spec shares one throwaway server and some toggle
          # instance-level flags, so it can only be parallelized across runners.
          # Each shard boots its own server, which keeps that isolation intact.
          - shard_index: 0
            shard_count: 2
            shard_label: 1/2
          - shard_index: 1
            shard_count: 2
            shard_label: 2/2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Restore regenerated PR lockfile (if policy uploaded one)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pr-lockfile
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify runner Chrome
        # GitHub's Ubuntu runner image already ships Google Chrome, so use that
        # directly for the headless e2e lane instead of downloading Playwright
        # browser bundles inside the 30 minute job budget.
        run: google-chrome --version

      # No Paperclip config is written into the runner user's home:
      # tests/e2e/playwright.config.ts boots the server in its own temporary
      # PAPERCLIP_HOME/PAPERCLIP_CONFIG, and a config in the home directory
      # would clobber a self-hosted runner's own Paperclip instance.
      - name: Run e2e tests
        env:
          PAPERCLIP_E2E_SKIP_LLM: "true"
          PAPERCLIP_PLAYWRIGHT_CHANNEL: "chrome"
        run: |
          # Playwright's own --shard balances by test count, and one spec
          # (smoke-lab) is ~40% of the lane's wall clock. Partition by recorded
          # spec duration instead so both runners finish together.
          specs="$(node ./scripts/e2e-shard.mjs \
            --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }})"
          echo "shard ${{ matrix.shard_label }} specs: $specs"
          pnpm run test:e2e -- $specs

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.shard_index }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14

  e2e:
    # Preserve the legacy required-check name while the specs run sharded
    # across the matrix above (same pattern as the `verify` aggregate).
    name: e2e
    if: ${{ always() }}
    needs: [e2e_shards]
    runs-on: ${{ (vars.PAPERCLIP_CI_RUNS_ON != '' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.PAPERCLIP_CI_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 5

    steps:
      - name: Fail if any e2e shard failed
        env:
          E2E_SHARDS_RESULT: ${{ needs.e2e_shards.result }}
        run: test "$E2E_SHARDS_RESULT" = "success"
