name: PR

on:
  pull_request:
    # Fork: also gate PRs into release/** branches (GitHub evaluates the
    # pull_request trigger from the base branch's copy of this file).
    branches:
      - master
      - 'release/**'

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    # Upstream calls paperclipai/paperclip/.github/workflows/pr-trusted.yml@master
    # so its AWS runner group only ever executes code-owner-reviewed master.
    # The fork has no AWS runner group (pr-trusted.yml's gate fails closed to
    # ubuntu-latest outside paperclipai/paperclip), and running upstream's
    # master workflow against fork checkouts would test fork code with a CI
    # definition that drifts independently of it. Use this commit's copy.
    uses: ./.github/workflows/pr-trusted.yml
