packages:
  - packages/*
  - packages/adapters/*
  - packages/plugins/*
  # Keep sandbox-provider plugins installable as standalone packages without
  # forcing root pnpm-lock.yaml churn for their third-party deps.
  - "!packages/plugins/sandbox-providers/**"
  - packages/plugins/examples/*
  # Keep this smoke fixture installable as a local plugin example without
  # forcing PRs to commit pnpm-lock.yaml for a new workspace importer.
  - "!packages/plugins/examples/plugin-orchestration-smoke-example"
  # This internal shadow plugin owns TypeSafe dependencies and is installed in
  # its package directory so PRs never need to modify the root lockfile.
  - "!packages/plugins/plugin-typesafe-skill-suggestion"
  - server
  - ui
  - cli

# Keep in sync with package.json#pnpm.patchedDependencies. Newer pnpm
# versions read patch configuration only from the workspace manifest.
patchedDependencies:
  "@dnd-kit/core@6.3.1": patches/@dnd-kit__core@6.3.1.patch
  postgres@3.4.9: patches/postgres@3.4.9.patch
  embedded-postgres@18.1.0-beta.16: patches/embedded-postgres@18.1.0-beta.16.patch
  acpx@0.12.0: patches/acpx@0.12.0.patch
  # Fork (#61): codex-local stays on codex-acp 1.1.7 with the non-retryable
  # provider-error patch; the runner's 1.6.2 copy keeps upstream's patch.
  "@agentclientprotocol/codex-acp@1.1.7": patches/@agentclientprotocol__codex-acp@1.1.7.patch
  acpx@0.13.1: patches/acpx@0.13.1.patch
  "@agentclientprotocol/claude-agent-acp@0.73.0": patches/@agentclientprotocol__claude-agent-acp@0.73.0.patch
  "@agentclientprotocol/codex-acp@1.6.2": patches/@agentclientprotocol__codex-acp@1.6.2.patch
  "@chat-adapter/slack@4.39.0": patches/@chat-adapter__slack@4.39.0.patch
  "@chat-adapter/discord@4.39.0": patches/@chat-adapter__discord@4.39.0.patch
  "@chat-adapter/telegram@4.39.0": patches/@chat-adapter__telegram@4.39.0.patch
  "@chat-adapter/teams@4.39.0": patches/@chat-adapter__teams@4.39.0.patch
  "@chat-adapter/github@4.39.0": patches/@chat-adapter__github@4.39.0.patch
  "@discordjs/ws@1.2.3": patches/@discordjs__ws@1.2.3.patch

# Agent CLIs share the current runtime used by the native provider pack.
# pnpm patches change package files, but overrides control dependency resolution.
overrides:
  # The local ACP bridge retains its typed-error patch while using the native
  # release qualified for WebSocket retry advice and its complete tool resources.
  "@agentclientprotocol/codex-acp@1.1.7>@openai/codex": "0.163.0"
  "@agentclientprotocol/codex-acp@1.6.2>@openai/codex": "0.156.0"
  "@agentclientprotocol/claude-agent-acp@0.73.0>@anthropic-ai/claude-agent-sdk": "0.3.280"
  rollup: ">=4.59.0"
  # Enforce the patched floor for Mermaid and every other transitive consumer.
  dompurify: "^3.4.17"
  # Better Auth exposes Vitest as an optional production peer.
  "vitest@4.1.12>vite": "8.2.4"
  react: "^19.2.8"
  react-dom: "^19.2.8"
  # Fork production dependency audit pins (#44, OXFA-27638); mirrored from
  # package.json#pnpm.overrides.
  "brace-expansion@<2": "1.1.21"
  "brace-expansion@>=2 <3": "2.1.7"
  fast-uri: "3.1.9"
  js-yaml: "4.3.2"
  "nanoid@<4": "3.3.18"
  path-to-regexp: "8.4.0"
  react-router: "7.18.2"
  tar: "7.5.21"
  "undici@<7": "6.29.1"
  "undici@>=8 <9": "8.12.2"
  "@grpc/grpc-js": "1.14.5"
  # CodeMirror validates extensions with instanceof, so exactly one copy of
  # these two packages may resolve. Different CodeMirror packages pin
  # different transitive minors, which resolves two copies and crashes the
  # editor with "Unrecognized extension value in extension set". A shared
  # range forces every consumer onto one resolution.
  "@codemirror/state": "^6.7.2"
  "@codemirror/view": "^6.43.11"

  # Security fixes; keep legacy protocol bridge pins above unchanged.
  "qs": "6.16.0"
  "body-parser": "2.4.0"
  "hono": "4.13.13"
  "svix@1.76.1>uuid": "11.1.1"
  "@esbuild-kit/core-utils@3.3.2>esbuild": "0.25.12"
  "form-data@>=4 <4.0.6": "4.0.6"
  # Parsers and highlighters must share NodeProp IDs from one Lezer instance.
  # Mixed copies can interpret unrelated node metadata as highlighting tags.
  "@lezer/common": "^1.5.2"

  # Patched MSAL floor for the Teams SDK; verify client-credentials compatibility.
  "@microsoft/teams.apps@2.0.16>@azure/msal-node": "7.1.0"

  # Keep this mirror aligned with package.json for newer pnpm clients.
  "ip-address": "10.7.4"
  "smol-toml": "1.9.0"
  "fast-copy@>=4 <5": "4.1.0"
  "postcss-selector-parser": "7.1.6"
  "follow-redirects": "1.16.1"
  "proxy-addr": "2.0.8"
  "source-map-js": "1.2.2"
  "sharp": "0.35.5"
  "@modelcontextprotocol/sdk": "1.32.1"
  "zod@>=4 <5": "4.6.7"
